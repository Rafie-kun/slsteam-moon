name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Build in the image the portable release uses, because the glibc gate only
    # means something with the shipped toolchain. On ubuntu-latest's 2.39
    # headers the same source pulls __isoc23_strto* and needs GLIBC_2.38, which
    # no 2.34 floor can accept.
    container: ubuntu:22.04
    steps:
      # Before checkout: a bare ubuntu image has no git for the action to use.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git g++ make pkg-config libssl-dev \
            libcurl4-openssl-dev zip unzip binutils file

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -j"$(nproc)"

      - name: Check ELF architecture and glibc floor
        run: |
          file bin/SLSsteam.so bin/library-inject.so bin/pattern-refresh
          ./scripts/check-sls-abi.sh bin/SLSsteam.so
          ./scripts/check-pattern-refresh-abi.sh bin/pattern-refresh

      - name: Checked-in static dependencies are x86-64
        run: |
          for archive in lib/*.a; do
            objdump -f "$archive" | grep -q 'file format elf64-x86-64'
          done

      - name: Structure and helper tests
        run: |
          make \
            test-ascii \
            test-audit-symbols \
            test-audit-policy \
            test-memhlp-pic \
            test-memhlp-target \
            test-memhlp-prologue \
            test-clientcompat \
            test-disp32 \
            test-dlcids \
            test-pattern-catalog \
            test-pattern-cache \
            test-utils-sha \
            test-runtime-dependencies \
            test-atomic-file \
            test-cache-pair \
            test-config-path \
            test-manifest-index \
            test-manifestselection \
            test-boundedexecutor \
            test-thread-start \
            test-mtvar-contains \
            test-reconcilepin-scan \
            test-patternscan \
            test-manifest-zip \
            test-yaml-runtime
